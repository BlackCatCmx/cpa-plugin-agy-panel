<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Antigravity 额度</title>
  <style>
    :root{color-scheme:light;--bg:#faf9f5;--card:#fffdf9;--soft:#f0eee8;--text:#2d2a26;--muted:#807a72;--border:#e3e1db;--green:#35b58a;--red:#c65746;--gold:#926b16}
    :root[data-theme="dark"]{color-scheme:dark;--bg:#151412;--card:#1d1b18;--soft:#262320;--text:#f6f4f1;--muted:#b4aca2;--border:#3a3530;--green:#35b58a;--red:#ec8475;--gold:#eaca79}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:1480px;margin:auto;padding:28px}h1{font-size:30px;letter-spacing:-1px;margin:0}h2{font-size:15px;margin:0}p{margin:8px 0;color:var(--muted)}button,input,textarea,select{font:inherit}button{border:1px solid var(--border);border-radius:9px;background:var(--card);color:var(--text);padding:8px 13px;cursor:pointer}button:hover{background:var(--soft)}button:disabled{opacity:.5;cursor:default}button.primary{background:var(--text);color:var(--bg)}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--green);outline-offset:2px}header,.toolbar,.actions,.card-head,.row-head{display:flex;justify-content:space-between;align-items:center;gap:12px}header{margin-bottom:22px}.eyebrow{font:11px monospace;letter-spacing:2px;color:var(--green);margin-bottom:6px}.summary{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:18px;color:var(--muted)}.summary strong{color:var(--text);font-size:20px}details{border:1px solid var(--border);border-radius:12px;margin-bottom:20px;background:var(--card)}summary{padding:12px 16px;cursor:pointer;font-weight:600}.settings{padding:0 16px 16px}.settings p{font-size:12px}.refresh-settings{border-bottom:1px solid var(--border);margin-bottom:14px;padding-bottom:10px}.refresh-settings .message{margin-top:0}textarea,input,select{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:10px}textarea{width:100%;height:140px;resize:vertical;font:12px/1.7 Consolas,monospace}input{width:100%;font:12px Consolas,monospace}label{display:block;margin-bottom:6px;font-size:12px}.actions{justify-content:flex-start;flex-wrap:wrap;margin-top:10px}.message,.error{white-space:pre-wrap;overflow-wrap:anywhere}.message{color:var(--muted);font-size:12px;margin-top:10px}.error{color:var(--red);font-size:12px}.banner{padding:12px 16px;border:1px solid var(--red);border-radius:10px;color:var(--red);margin-bottom:18px;white-space:pre-wrap}.banner:empty{display:none}.toolbar{margin:20px 0 14px}.toolbar input{max-width:300px}.toolbar select{padding:8px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}.card{min-width:0;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:0 10px 22px -20px #000}.card-head{gap:8px}.identity{display:flex;align-items:center;gap:8px;min-width:0;flex:1}.head-actions{display:flex;gap:6px;align-items:center;flex-shrink:0}.name{font-size:12px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.plan{display:inline-flex;flex-shrink:0;align-items:center;height:24px;border:1px solid var(--border);border-radius:20px;padding:2px 8px;font-weight:700;font-size:11px}.plan.pro{border-color:rgba(16,185,129,.38);background:linear-gradient(135deg,#ecfdf5,#a7f3d0);color:#087653}.plan.ultra{border-color:rgba(217,165,22,.72);background:radial-gradient(circle at 18% 24%,#fff 0%,rgba(255,255,255,.3) 35%,transparent 43%),linear-gradient(135deg,#fff9e3 0%,#ffe07f 52%,#e0aa14 100%);color:#6b4b00;box-shadow:0 0 13px rgba(255,214,98,.25)}.plan.ultra-lite{border-color:rgba(139,92,246,.38);background:linear-gradient(135deg,#f5f3ff,#c4b5fd);color:#6740bd}:root[data-theme="dark"] .plan.pro{background:linear-gradient(135deg,#12352b,#176149);color:#a7f3d0}:root[data-theme="dark"] .plan.ultra{background:linear-gradient(135deg,#4f3d0b,#8f6d10);color:#fff0a8}:root[data-theme="dark"] .plan.ultra-lite{background:linear-gradient(135deg,#281f46,#483580);color:#ddd6fe}.status-toggle{font-size:10px;font-weight:650;border-radius:20px;padding:4px 8px;white-space:nowrap;color:var(--green);border-color:color-mix(in srgb,var(--green) 35%,var(--border));background:color-mix(in srgb,var(--green) 8%,var(--card))}.status-toggle.off{color:var(--muted);border-color:var(--border);background:var(--soft)}.status-toggle.unavailable{color:var(--red)}.refresh{display:grid;place-items:center;width:29px;height:29px;padding:0;font-size:21px;line-height:1}.account-meta{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:10.5px;color:var(--muted);margin-top:8px}.account-meta span{white-space:nowrap}.display-settings{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);padding:0 0 12px;margin-bottom:14px}.display-settings label{display:flex;align-items:center;gap:7px;margin:0}.display-settings input{width:auto;accent-color:var(--green)}.display-settings .message{margin:0}.meta{font-size:11px;color:var(--muted);margin-bottom:9px}.group{border-top:1px dashed var(--border);padding-top:8px;margin-top:8px}.group h2{font-size:12px;color:var(--muted);margin-bottom:8px}.quota-row+.quota-row{margin-top:12px}.row-head{font-size:12px;align-items:baseline;gap:8px;margin-bottom:6px}.quota-label{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:650}.quota-value{display:flex;align-items:baseline;gap:7px;flex-shrink:0}.remaining{white-space:nowrap;font-size:11.5px;font-weight:750}.reset{font-size:10.5px;white-space:nowrap;color:var(--muted)}.track{height:6px;background:var(--soft);border-radius:6px;overflow:hidden}.fill{height:100%;border-radius:6px;background:var(--green)}.empty{color:var(--muted);padding:18px 0}.pagination{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:22px}.disabled .identity,.disabled .account-meta,.disabled .group{opacity:.65}.disabled .fill{background:var(--muted)}.disabled .plan{border-color:var(--border);background:var(--soft);color:var(--muted);box-shadow:none}
    @media(max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:700px){main{padding:18px 12px}.grid{grid-template-columns:1fr}h1{font-size:25px}.toolbar{flex-wrap:wrap}.toolbar input{max-width:none}.summary{gap:12px}.card{padding:15px}}
  </style>
</head>
<body>
  <main>
    <header><div><div class="eyebrow">CPA / ANTIGRAVITY</div><h1>Antigravity 额度</h1></div><button id="theme" type="button">切换主题</button></header>
    <div class="summary" id="summary"></div>
    <div class="banner" id="banner" role="alert"></div>
    <details>
      <summary>显示、刷新与代理设置</summary>
      <div class="settings">
        <div class="display-settings"><label for="show-claude-gpt"><input id="show-claude-gpt" type="checkbox">显示 Claude 和 GPT 模型额度</label><span class="message" id="display-message" role="status"></span></div>
        <div class="refresh-settings"><label for="ua">刷新 User-Agent</label><input id="ua" spellcheck="false"><div class="actions"><button id="save-ua" type="button">保存 UA</button><span class="message" id="ua-message" role="status"></span></div><p>默认与 CPA 原生前端一致，保存后用于套餐和额度刷新。</p></div>
        <label for="proxies">代理列表 · 每行一个</label>
        <textarea id="proxies" spellcheck="false" placeholder="socks5://127.0.0.1:10808"></textarea>
        <p>列表保存在 CPA 配置中。按凭证名称排序，将代理依次循环分配给所有 Antigravity 凭证（含停用凭证）。失败条目不消耗代理顺序。</p>
        <div class="actions"><button id="save-proxies" type="button">保存列表</button><button id="apply-proxies" class="primary" type="button">保存并应用到全部凭证</button></div>
        <div class="message" id="proxy-message" role="status"></div>
      </div>
    </details>
    <div class="toolbar"><input id="search" aria-label="搜索账号" placeholder="搜索邮箱或凭证名称"><select id="filter" aria-label="筛选账号"><option value="all">全部账号</option><option value="enabled">已启用</option><option value="disabled">已停用</option><option value="waiting">未刷新</option></select><button id="reload" type="button">更新账号列表</button></div>
    <div class="meta">套餐与额度保存在当前浏览器，关闭后仍保留。刷新按钮查询最新套餐与额度；重置时间到达后需再次刷新确认。</div>
    <div class="grid" id="grid"></div>
    <nav class="pagination" id="pagination" aria-label="账号分页"></nav>
  </main>
  <script type="module" src="./panel-app.mjs"></script>
</body>
</html>
