<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Antigravity 额度</title>
  <style>
    :root{color-scheme:light;--bg:#faf9f5;--card:#fffdf9;--soft:#f0eee8;--text:#2d2a26;--muted:#807a72;--border:#e3e1db;--green:#35b58a;--red:#c65746;--gold:#926b16}
    :root[data-theme="dark"]{color-scheme:dark;--bg:#151412;--card:#1d1b18;--soft:#262320;--text:#f6f4f1;--muted:#b4aca2;--border:#3a3530;--green:#35b58a;--red:#ec8475;--gold:#eaca79}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:1480px;margin:auto;padding:28px}h1{font-size:30px;letter-spacing:-1px;margin:0}h2{font-size:15px;margin:0}p{margin:8px 0;color:var(--muted)}button,input,textarea,select{font:inherit}button{border:1px solid var(--border);border-radius:9px;background:var(--card);color:var(--text);padding:8px 13px;cursor:pointer}button:hover{background:var(--soft)}button:disabled{opacity:.5;cursor:default}button.primary{background:var(--text);color:var(--bg)}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--green);outline-offset:2px}header,.toolbar,.actions,.card-head,.row-head{display:flex;justify-content:space-between;align-items:center;gap:12px}header{margin-bottom:22px}.eyebrow{font:11px monospace;letter-spacing:2px;color:var(--green);margin-bottom:6px}.summary{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:18px;color:var(--muted)}.summary strong{color:var(--text);font-size:20px}details{border:1px solid var(--border);border-radius:12px;margin-bottom:20px;background:var(--card)}summary{padding:12px 16px;cursor:pointer;font-weight:600}.settings{padding:0 16px 16px}.settings p{font-size:12px}.refresh-settings{border-bottom:1px solid var(--border);margin-bottom:14px;padding-bottom:10px}.refresh-settings .message:empty{display:none}.ua-row{display:flex;align-items:center;gap:8px;max-width:760px}.ua-row input{min-width:0;flex:1}.ua-row button{flex-shrink:0;white-space:nowrap}textarea,input,select{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:10px}textarea{width:100%;height:140px;resize:vertical;font:12px/1.7 Consolas,monospace}input{width:100%;font:12px Consolas,monospace}label{display:block;margin-bottom:6px;font-size:12px}.actions{justify-content:flex-start;flex-wrap:wrap;margin-top:10px}.message,.error{white-space:pre-wrap;overflow-wrap:anywhere}.message{color:var(--muted);font-size:12px;margin-top:10px}.error{color:var(--red);font-size:12px}.banner{padding:12px 16px;border:1px solid var(--red);border-radius:10px;color:var(--red);margin-bottom:18px;white-space:pre-wrap}.banner:empty{display:none}.toolbar{margin:20px 0 14px}.toolbar input{max-width:300px}.toolbar select{padding:8px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}.card{min-width:0;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:0 10px 22px -20px #000}.card-head{gap:8px}.identity{display:flex;align-items:center;gap:8px;min-width:0;flex:1}.head-actions{display:flex;gap:6px;align-items:center;flex-shrink:0}.name{font-size:12px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.plan{display:inline-flex;flex-shrink:0;align-items:center;height:24px;border:1px solid var(--border);border-radius:20px;padding:2px 8px;font-weight:700;font-size:11px}.plan.pro{border-color:rgba(16,185,129,.38);background:linear-gradient(135deg,#ecfdf5,#a7f3d0);color:#087653}.plan.ultra{border-color:rgba(217,165,22,.72);background:radial-gradient(circle at 18% 24%,#fff 0%,rgba(255,255,255,.3) 35%,transparent 43%),linear-gradient(135deg,#fff9e3 0%,#ffe07f 52%,#e0aa14 100%);color:#6b4b00;box-shadow:0 0 13px rgba(255,214,98,.25)}.plan.ultra-lite{border-color:rgba(139,92,246,.38);background:linear-gradient(135deg,#f5f3ff,#c4b5fd);color:#6740bd}:root[data-theme="dark"] .plan.pro{background:linear-gradient(135deg,#12352b,#176149);color:#a7f3d0}:root[data-theme="dark"] .plan.ultra{background:linear-gradient(135deg,#4f3d0b,#8f6d10);color:#fff0a8}:root[data-theme="dark"] .plan.ultra-lite{background:linear-gradient(135deg,#281f46,#483580);color:#ddd6fe}.status-toggle{font-size:10px;font-weight:650;border-radius:20px;padding:4px 8px;white-space:nowrap;color:var(--green);border-color:color-mix(in srgb,var(--green) 35%,var(--border));background:color-mix(in srgb,var(--green) 8%,var(--card))}.status-toggle.off{color:var(--muted);border-color:var(--border);background:var(--soft)}.status-toggle.unavailable{color:var(--red)}.refresh{display:grid;place-items:center;width:29px;height:29px;padding:0;font-size:21px;line-height:1}.account-meta{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:10.5px;color:var(--muted);margin-top:8px}.account-meta span{white-space:nowrap}.display-settings{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);padding:0 0 12px;margin-bottom:14px}.display-settings label{display:flex;align-items:center;gap:7px;margin:0}.display-settings input{width:auto;accent-color:var(--green)}.display-settings .message{margin:0}.meta{font-size:11px;color:var(--muted);margin-bottom:9px}.group{border-top:1px dashed var(--border);padding-top:8px;margin-top:8px}.group h2{font-size:12px;color:var(--muted);margin-bottom:8px}.quota-row+.quota-row{margin-top:12px}.row-head{font-size:12px;align-items:baseline;gap:8px;margin-bottom:6px}.quota-label{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:650}.quota-value{display:flex;align-items:baseline;gap:7px;flex-shrink:0}.remaining{white-space:nowrap;font-size:11.5px;font-weight:750}.reset{font-size:10.5px;white-space:nowrap;color:var(--muted)}.track{height:6px;background:var(--soft);border-radius:6px;overflow:hidden}.fill{height:100%;border-radius:6px;background:var(--green)}.empty{color:var(--muted);padding:18px 0}.pagination{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:22px}.disabled .identity,.disabled .account-meta,.disabled .group{opacity:.65}.disabled .fill{background:var(--muted)}.disabled .plan{border-color:var(--border);background:var(--soft);color:var(--muted);box-shadow:none}
    @media(max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:700px){main{padding:18px 12px}.grid{grid-template-columns:1fr}h1{font-size:25px}.toolbar{flex-wrap:wrap}.toolbar input{max-width:none}.summary{gap:12px}.card{padding:15px}}
    dialog{width:min(1040px,calc(100% - 32px));max-height:calc(100dvh - 32px);padding:22px;border:1px solid var(--border);border-radius:16px;background:var(--card);color:var(--text);box-shadow:0 24px 80px #0004;overflow:auto}dialog::backdrop{background:#0007}body:has(dialog[open]){overflow:hidden}.proxy-header,.proxy-pane-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.proxy-header{margin-bottom:18px}.proxy-header h2{font-size:21px}.proxy-header p,.proxy-footer p{font-size:12px}.proxy-header button{flex-shrink:0}#proxy-controls{border:0;padding:0;margin:0;min-width:0}.proxy-columns{display:grid;grid-template-columns:1fr 1fr;gap:18px}.proxy-pane{min-width:0;border:1px solid var(--border);border-radius:12px;padding:14px}.proxy-pane-head{margin-bottom:12px}.proxy-pane h3{font-size:14px;margin:0}.select-all{display:flex;align-items:center;gap:6px;margin:0;white-space:nowrap}.select-all input,.choice input{width:auto;flex-shrink:0;accent-color:var(--green)}.choice-list{height:280px;overflow:auto}.choice{display:flex;align-items:center;gap:9px;padding:10px 8px;margin:0;border-bottom:1px solid var(--border);border-radius:6px;cursor:pointer}.choice:has(input:checked){background:color-mix(in srgb,var(--green) 9%,var(--card))}.choice-text{min-width:0;flex:1}.choice-name{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:12px Consolas,monospace}.choice-detail{display:block;color:var(--muted);font-size:11px;margin-top:2px}#credential-search{margin-bottom:8px}.proxy-editor{margin:12px 0 0;border-radius:8px}.proxy-editor summary{padding:8px 10px;font-size:12px}.proxy-editor-body{padding:0 10px 10px}.proxy-editor textarea{height:120px;margin-bottom:8px}.proxy-footer{border-top:1px solid var(--border);margin-top:18px;padding-top:12px}.proxy-footer .meta{margin:0}#proxy-message:empty{display:none}@media(max-width:700px){dialog{padding:14px;width:calc(100% - 16px);max-height:calc(100dvh - 16px)}.proxy-columns{grid-template-columns:1fr;gap:12px}.choice-list{height:180px}.proxy-header{align-items:flex-start}.proxy-header p{margin-bottom:0}.toolbar .head-actions{flex-wrap:wrap}}
  </style>
</head>
<body>
  <main>
    <header><div><div class="eyebrow">CPA / ANTIGRAVITY</div><h1>Antigravity 额度</h1></div><button id="theme" type="button">切换主题</button></header>
    <div class="summary" id="summary"></div>
    <div class="banner" id="banner" role="alert"></div>
    <details>
      <summary>显示与刷新设置</summary>
      <div class="settings">
        <div class="display-settings"><label for="show-claude-gpt"><input id="show-claude-gpt" type="checkbox">显示 Claude 和 GPT 模型额度</label><span class="message" id="display-message" role="status"></span></div>
        <div class="refresh-settings"><label for="ua">刷新 User-Agent</label><div class="ua-row"><input id="ua" spellcheck="false"><button id="save-ua" type="button">保存 UA</button></div><div class="message" id="ua-message" role="status"></div></div>
      </div>
    </details>
    <div class="toolbar"><input id="search" aria-label="搜索账号" placeholder="搜索邮箱或凭证名称"><select id="filter" aria-label="筛选账号"><option value="all">全部账号</option><option value="enabled">已启用</option><option value="disabled">已停用</option><option value="waiting">未刷新</option></select><div class="head-actions"><button id="open-proxy" type="button" disabled>代理管理</button><button id="reload" type="button">更新账号列表</button></div></div>
    <div class="meta">套餐与额度保存在当前浏览器，关闭后仍保留。刷新按钮查询最新套餐与额度；重置时间到达后需再次刷新确认。</div>
    <div class="grid" id="grid"></div>
    <nav class="pagination" id="pagination" aria-label="账号分页"></nav>
  </main>
  <dialog id="proxy-dialog" aria-labelledby="proxy-title">
    <div class="proxy-header"><div><h2 id="proxy-title">代理管理</h2><p>选择代理与凭证，单个代理直接分配，多个代理按列表顺序循环分配。</p></div><button id="close-proxy" type="button" aria-label="关闭代理管理">关闭</button></div>
    <fieldset id="proxy-controls">
      <div class="proxy-columns">
        <section class="proxy-pane">
          <div class="proxy-pane-head"><h3>代理</h3><label class="select-all"><input id="proxy-select-all" type="checkbox">全选</label></div>
          <div id="proxy-list" class="choice-list"></div>
          <details class="proxy-editor"><summary>编辑代理列表</summary><div class="proxy-editor-body"><label for="proxies">每行一个，保存后可勾选</label><textarea id="proxies" spellcheck="false" placeholder="socks5://127.0.0.1:10808"></textarea><button id="save-proxies" type="button">保存列表</button></div></details>
        </section>
        <section class="proxy-pane">
          <div class="proxy-pane-head"><h3>Antigravity 凭证</h3><label class="select-all"><input id="credential-select-all" type="checkbox">全选</label></div>
          <input id="credential-search" type="search" aria-label="筛选待分配凭证" placeholder="搜索凭证名称">
          <div id="credential-list" class="choice-list"></div>
        </section>
      </div>
      <div class="proxy-footer"><div id="proxy-selection" class="meta" aria-live="polite"></div><div class="actions"><button id="increment-proxies" type="button">增量分配</button><button id="apply-proxies" class="primary" type="button">覆盖分配</button><button id="clear-selected-proxies" type="button">清空所选凭证代理</button></div><p>按凭证名称排序分配，跳过及失败条目不消耗代理顺序。增量只填充空代理；覆盖替换所选凭证的代理。</p><p>清空仅处理勾选凭证，之后恢复 CPA 全局代理设置，代理列表保留。</p></div>
    </fieldset>
    <div id="proxy-message" class="message" role="status"></div>
  </dialog>
  <script type="module" src="./panel-app.mjs"></script>
</body>
</html>
